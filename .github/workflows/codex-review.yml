# Asks Codex to review every PR. Enabled org-wide through a ruleset
# ("Require workflows to pass"), so it runs in each target repo.
# CODEX_BOT_PAT: org secret, PAT of the bot account linked to ChatGPT/Codex.
#
# The ruleset requires a passing run on every PR head commit, so this must run
# (and pass) on each push. It only comments on open and ready-for-review.
name: Codex review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  codex:
    runs-on: ubuntu-latest
    steps:
      - if: ${{ !github.event.pull_request.draft && (github.event.action == 'opened' || github.event.action == 'ready_for_review') }}
        run: gh pr comment "$PR" --repo "$REPO" --body "@codex review"
        env:
          GH_TOKEN: ${{ secrets.CODEX_BOT_PAT }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
